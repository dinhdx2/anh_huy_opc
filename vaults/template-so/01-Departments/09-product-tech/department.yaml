code: 09-product-tech
name_vn: Sản phẩm & Công nghệ
tier: 4
description: Phòng Sản phẩm & Công nghệ — DN bán template/asset số tiếng Việt (GĐ1 validate). "Sản-phẩm" chính LÀ template số; phòng lo (a) hạ-tầng GIAO template tự-động có kiểm-soát — landing bán, cổng thanh-toán VN (SePay/PayOS), link tải cá-nhân-hóa + watermark, webhook giao-hàng-sau-thanh-toán; (b) bảo-mật — secret/API key KHÔNG để trong repo (bài-học ngành), chống lộ file gốc/bản-quyền, tuân NĐ 13/2023 khi xử-lý email/Zalo; (c) backlog template theo tín-hiệu bán + versioning/cập-nhật. GĐ1 ưu-tiên hạ-tầng đủ-dùng, đo-được, không over-engineer.
